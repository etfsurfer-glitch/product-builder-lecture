<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 얼굴은 얼마? | AI 얼굴 가치 측정</title>
    <meta name="description" content="AI가 분석하는 내 얼굴의 경제적 가치! 카메라 촬영이나 사진 업로드로 지금 바로 확인해보세요.">
    
    <link href='/style.css' rel='stylesheet'>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    
    <style>
        :root {
            --accent: #ff6b6b;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }

        .main-layout {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 14px;
        }

        .card {
            background: var(--container-bg);
            border-radius: 1.5rem;
            box-shadow: var(--box-shadow);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--lotto-number-bg);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .seg {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .seg button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--lotto-number-bg);
            background: var(--lotto-number-bg);
            color: var(--text-color);
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .seg button.active {
            background: var(--button-bg);
            color: white;
            border-color: var(--button-bg);
        }

        .video-wrap {
            width: 100%;
            aspect-ratio: 1/1;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            margin-bottom: 16px;
        }

        video, #preview-img, #camera-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            min-width: 100px;
            transition: opacity 0.2s;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary { background: var(--button-bg); color: white; }
        .btn-secondary { background: var(--lotto-number-bg); color: var(--text-color); }
        .btn-danger { background: #ff4757; color: white; }

        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.05);
            text-align: center;
        }

        /* 분석 결과 스타일 */
        .result-box {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .rank-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: white;
        }

        .value-amount {
            font-size: 2.8rem;
            font-weight: 900;
            margin: 10px 0;
            color: var(--button-bg);
            word-break: keep-all;
        }

        .loader {
            display: none;
            padding: 40px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--lotto-number-bg);
            border-top: 4px solid var(--button-bg);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .rank-거지 { background: #888; }
        .rank-평민 { background: #4a90e2; }
        .rank-먹히는 { background: #50e3c2; }
        .rank-준연예인 { background: #f5a623; }
        .rank-스타급 { background: #d0021b; box-shadow: 0 0 15px rgba(208,2,27,0.4); }

    </style>
</head>
<body>
    <nav class="main-nav">
        <a href="/" class="nav-link">홈</a>
        <a href="/lotto.html" class="nav-link">로또번호추출기</a>
        <a href="/dinner.html" class="nav-link">저녁메뉴추천</a>
        <a href="/pastlife.html" class="nav-link">전생알아보기</a>
        <a href="/rps.html" class="nav-link">가위바위보게임</a>
        <a href="/face-value.html" class="nav-link active">내얼굴은얼마?</a>
    </nav>

    <div class="main-layout">
        <header style="text-align: center; margin-bottom: 30px;">
            <h1 style="font-size: 2.2rem; margin-bottom: 10px;">💰 내 얼굴은 얼마?</h1>
            <p style="opacity: 0.7;">인공지능이 당신의 관상과 매력을 분석하여 가치를 환산합니다.</p>
        </header>

        <div class="grid">
            <!-- 왼쪽: 입력 영역 -->
            <div class="card">
                <div class="seg">
                    <button id="mode-camera" class="active">📷 촬영하기</button>
                    <button id="mode-upload">🖼️ 업로드</button>
                </div>

                <div id="camera-section">
                    <div class="video-wrap">
                        <video id="webcam" autoplay playsinline muted></video>
                        <img id="camera-preview" style="display: none; position: absolute; top: 0; left: 0;">
                    </div>
                    <div class="btn-group">
                        <button id="btn-start-cam" class="btn btn-secondary" onclick="startWebcam()">카메라 켜기</button>
                        <button id="btn-capture" class="btn btn-primary" disabled onclick="capture()">찰칵! 분석하기</button>
                        <button id="btn-stop-cam" class="btn btn-danger" disabled onclick="stopWebcam()">끄기</button>
                    </div>
                </div>

                <div id="upload-section" style="display: none;">
                    <div class="video-wrap" style="background: var(--lotto-number-bg); display: flex; align-items: center; justify-content: center;">
                        <img id="preview-img" style="display: none;">
                        <div id="upload-placeholder" style="text-align: center; opacity: 0.5;">
                            <span style="font-size: 3rem;">📁</span><br>사진을 선택해주세요
                        </div>
                    </div>
                    <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileUpload(this)">
                    <div class="btn-group">
                        <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">파일 선택</button>
                        <button id="btn-analyze-upload" class="btn btn-primary" disabled onclick="analyzeUploadedImage()">분석 시작</button>
                    </div>
                </div>

                <div id="status-msg" class="status">준비되었습니다.</div>
            </div>

            <!-- 오른쪽: 결과 영역 -->
            <div class="card" style="display: flex; flex-direction: column; justify-content: center; min-height: 400px;">
                <div id="loader" class="loader">
                    <div class="spinner"></div>
                    <p id="loader-text">AI가 얼굴의 황금비율과<br>경제적 가치를 분석 중입니다...</p>
                </div>

                <div id="result-box" class="result-box">
                    <div id="rank-badge" class="rank-badge"></div>
                    <div style="font-size: 1.1rem; opacity: 0.8; margin-bottom: 5px;">측정된 당신의 가치</div>
                    <div id="value-amount" class="value-amount"></div>
                    <div id="gender-info" style="margin-top: 15px; font-weight: bold; opacity: 0.7;"></div>
                    
                    <hr style="margin: 25px 0; border: none; border-top: 1px solid var(--lotto-number-bg);">
                    
                    <button class="btn btn-secondary" onclick="reset()">다시 검사하기</button>
                </div>

                <div id="empty-msg" style="text-align: center; opacity: 0.4;">
                    <span style="font-size: 4rem;">⚖️</span><br>
                    왼쪽에서 사진을 입력하면<br>분석 결과가 여기에 표시됩니다.
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        // ✅ Teachable Machine 온라인 모델 주소로 변경
        const URL = "https://teachablemachine.withgoogle.com/models/eup-eLBVa/"; 
        let model, maxPredictions;
        let selectedImage = null;
        let stream = null;

        const videoEl = document.getElementById('webcam');
        const statusMsg = document.getElementById('status-msg');
        const btnCapture = document.getElementById('btn-capture');
        const btnStartCam = document.getElementById('btn-start-cam');
        const btnStopCam = document.getElementById('btn-stop-cam');
        const cameraPreview = document.getElementById('camera-preview');

        // 모드 전환
        document.getElementById('mode-camera').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('mode-upload').classList.remove('active');
            document.getElementById('camera-section').style.display = 'block';
            document.getElementById('upload-section').style.display = 'none';
            stopWebcam();
        });

        document.getElementById('mode-upload').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('mode-camera').classList.remove('active');
            document.getElementById('upload-section').style.display = 'block';
            document.getElementById('camera-section').style.display = 'none';
            stopWebcam();
        });

        // 모델 로딩
        async function loadModel() {
            if (!model) {
                try {
                    statusMsg.innerText = "AI 모델을 불러오는 중...";
                    const modelURL = URL + "model.json";
                    const metadataURL = URL + "metadata.json";
                    model = await tmImage.load(modelURL, metadataURL);
                    maxPredictions = model.getTotalClasses();
                    statusMsg.innerText = "모델 로드 완료.";
                } catch (e) {
                    console.error("모델 로드 실패:", e);
                    throw new Error("모델을 불러오지 못했습니다. URL을 확인해주세요.");
                }
            }
        }

        async function startWebcam() {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    statusMsg.innerText = "카메라 API를 지원하지 않는 브라우저입니다.";
                    return;
                }

                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                
                videoEl.srcObject = stream;
                videoEl.onloadedmetadata = () => {
                    videoEl.play();
                };
                
                videoEl.style.display = 'block';
                cameraPreview.style.display = 'none';
                
                btnStartCam.disabled = true;
                btnStopCam.disabled = false;
                btnCapture.disabled = false;
                statusMsg.innerText = "카메라가 연결되었습니다.";
            } catch (e) {
                console.error(e);
                let msg = "카메라 연결에 실패했습니다.";
                if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
                    msg += " (HTTPS 필요)";
                }
                statusMsg.innerText = msg;
            }
        }

        function stopWebcam() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            videoEl.srcObject = null;
            btnStartCam.disabled = false;
            btnStopCam.disabled = true;
            btnCapture.disabled = true;
            statusMsg.innerText = "카메라가 꺼졌습니다.";
        }

        function handleFileUpload(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('preview-img');
                    img.onload = function() {
                        img.style.display = 'block';
                        document.getElementById('upload-placeholder').style.display = 'none';
                        document.getElementById('btn-analyze-upload').disabled = false;
                        selectedImage = img;
                        statusMsg.innerText = "사진이 업로드되었습니다.";
                    };
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        async function capture() {
            if (!videoEl.videoWidth) return;

            const canvas = document.createElement('canvas');
            canvas.width = videoEl.videoWidth;
            canvas.height = videoEl.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // 좌우 반전 보정 (셀카 모드)
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(videoEl, 0, 0);
            
            selectedImage = canvas;
            cameraPreview.src = canvas.toDataURL('image/jpeg');
            cameraPreview.style.display = 'block';
            videoEl.style.display = 'none';
            
            stopWebcam();
            processAnalysis();
        }

        async function analyzeUploadedImage() {
            processAnalysis();
        }

        async function processAnalysis() {
            if (!selectedImage) {
                alert("사진을 먼저 입력해주세요.");
                return;
            }

            document.getElementById('empty-msg').style.display = 'none';
            document.getElementById('result-box').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('loader-text').innerText = "AI 모델을 로드하는 중...";
            
            try {
                await loadModel();
                document.getElementById('loader-text').innerText = "얼굴 특징점을 분석 중입니다...";
                
                // Teachable Machine 모델 예측
                const prediction = await model.predict(selectedImage);
                
                setTimeout(() => {
                    displayResult(prediction);
                }, 1500);
            } catch (e) {
                console.error("분석 에러:", e);
                alert("오류 발생: " + e.message);
                reset();
            }
        }

        function displayResult(prediction) {
            let maxProb = 0;
            let bestClass = "";
            
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > maxProb) {
                    maxProb = prediction[i].probability;
                    bestClass = prediction[i].className;
                }
            }

            // 성별 및 등급 판정 로직
            const className = bestClass.toLowerCase();
            let gender = (className.includes("man")) ? "남성" : "여성";
            let isA = bestClass.toUpperCase().includes("A");

            // 가치 산정 로직 조정 (더 넓은 분포를 위해)
            // A(잘생김/예쁨)라도 확률이 낮으면 낮은 금액부터 시작하도록 변경
            let minValue = isA ? 30000000 : 1000; 
            let maxValue = isA ? 100000000 : 70000000;
            
            let value = minValue + (maxValue - minValue) * maxProb;
            // 랜덤 변동폭을 주어 매번 조금씩 다른 결과 유도
            value += (Math.random() - 0.5) * 10000000; 
            value = Math.floor(Math.max(1000, Math.min(100000000, value)));

            let rank = "";
            let rankClass = "";
            let displayValue = value;
            
            // 💰 사용자 요청 구간으로 재설정
            if (value < 50000000) { 
                rank = "거지 등급"; 
                rankClass = "rank-거지"; 
                displayValue = 100; // 거지 등급은 무조건 100원
            } else if (value < 80000000) { 
                rank = "평민 등급"; 
                rankClass = "rank-평민"; 
            } else if (value < 90000000) { 
                rank = "먹히는 얼굴"; 
                rankClass = "rank-먹히는"; 
            } else if (value < 95000000) { 
                rank = "준연예인 급"; 
                rankClass = "rank-준연예인"; 
            } else { 
                rank = "스타급 미모"; 
                rankClass = "rank-스타급"; 
            }

            document.getElementById('rank-badge').innerText = rank;
            document.getElementById('rank-badge').className = "rank-badge " + rankClass;
            document.getElementById('value-amount').innerText = displayValue.toLocaleString() + " 원";
            document.getElementById('gender-info').innerText = "AI 판정: " + gender + " (정확도: " + (maxProb * 100).toFixed(1) + "%)";

            document.getElementById('loader').style.display = 'none';
            document.getElementById('result-box').style.display = 'block';
        }

        function reset() {
            document.getElementById('result-box').style.display = 'none';
            document.getElementById('empty-msg').style.display = 'block';
            document.getElementById('loader').style.display = 'none';
            document.getElementById('preview-img').style.display = 'none';
            document.getElementById('camera-preview').style.display = 'none';
            document.getElementById('upload-placeholder').style.display = 'block';
            document.getElementById('btn-analyze-upload').disabled = true;
            document.getElementById('file-input').value = "";
            videoEl.style.display = 'block';
            stopWebcam();
        }
    </script>
</body>
</html>
