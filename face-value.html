    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">
        // Teachable Machine 모델 URL
        const URL = "./my_model/";

        let model, webcam, labelContainer, maxPredictions;
        let isPredicting = false;

        async function init() {
            document.getElementById("start-container").style.display = "none";
            document.getElementById("loading").style.display = "block";

            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                const flip = true;
                webcam = new tmImage.Webcam(300, 300, flip);
                await webcam.setup();
                await webcam.play();
                window.requestAnimationFrame(loop);

                document.getElementById("loading").style.display = "none";
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                document.getElementById("result-container").style.display = "block";
                
                labelContainer = document.getElementById("label-container");
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }
                isPredicting = true;
            } catch (error) {
                console.error(error);
                alert("모델을 로드하거나 카메라에 접근하는 중 오류가 발생했습니다.");
                document.getElementById("start-container").style.display = "block";
                document.getElementById("loading").style.display = "none";
            }
        }

        async function loop() {
            if (isPredicting) {
                webcam.update();
                await predict();
                window.requestAnimationFrame(loop);
            }
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            // 가장 높은 확률을 가진 클래스 찾기
            let maxProb = 0;
            let bestClass = "";
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > maxProb) {
                    maxProb = prediction[i].probability;
                    bestClass = prediction[i].className;
                }
            }

            if (maxProb > 0.5) {
                updateResult(bestClass, maxProb);
            }
        }

        function updateResult(className, probability) {
            let gender = "";
            let isHandsome = false;
            
            // 클래스 분석: "man A", "man B", "girl A" (또는 "gilr A"), "girl B" (또는 "gilr B")
            if (className.toLowerCase().includes("man")) {
                gender = "남성";
            } else if (className.toLowerCase().includes("girl") || className.toLowerCase().includes("gilr")) {
                gender = "여성";
            }

            if (className.toUpperCase().includes("A")) {
                isHandsome = true;
            }

            // 가치 계산 (확률에 따라 어느 정도 보정)
            let minValue, maxValue;
            if (isHandsome) {
                // A는 잘생김/예쁨 -> 5천만 ~ 1억
                minValue = 50000000;
                maxValue = 100000000;
            } else {
                // B는 못생김 -> 1천 ~ 5천만
                minValue = 1000;
                maxValue = 50000000;
            }

            // 확률을 반영하여 값 결정 (재미를 위해 랜덤성 추가)
            let baseValue = minValue + (maxValue - minValue) * probability;
            let randomOffset = (Math.random() - 0.5) * 1000000; // ±50만원 랜덤
            let finalValue = Math.floor(Math.max(1000, Math.min(100000000, baseValue + randomOffset)));

            // 랭크 결정
            let rank = "";
            if (finalValue <= 1000000) rank = "거지";
            else if (finalValue <= 10000000) rank = "평민";
            else if (finalValue <= 50000000) rank = "먹히는 얼굴";
            else if (finalValue <= 80000000) rank = "준연예인";
            else rank = "스타급";

            document.getElementById("gender-display").innerText = `분석 결과: ${gender}`;
            document.getElementById("rank-display").innerText = `등급: ${rank}`;
            document.getElementById("value-display").innerText = `가치: ${finalValue.toLocaleString()}원`;
        }
    </script>
