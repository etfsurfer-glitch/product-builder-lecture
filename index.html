<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>점검 중 | RUNTO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;
  background:#0f0e1a;
  color:#fff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.container{padding:40px 24px;max-width:480px;width:100%}
.icon{font-size:64px;margin-bottom:24px;animation:spin 4s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
h1{
  font-size:2rem;
  font-weight:700;
  margin-bottom:12px;
  background:linear-gradient(135deg,#6c5ce7,#a29bfe);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
p{
  font-size:1rem;
  color:#a09ec0;
  line-height:1.8;
  margin-bottom:8px;
}
.badge{
  display:inline-block;
  margin-top:28px;
  padding:10px 24px;
  background:rgba(108,92,231,.15);
  border:1px solid rgba(108,92,231,.4);
  border-radius:100px;
  font-size:.85rem;
  color:#a29bfe;
  font-weight:500;
}
</style>
</head>
<body>
<div class="container">
  <div class="icon">⚙️</div>
  <h1>서비스 점검 중</h1>
  <p>더 나은 서비스를 위해 시스템 점검을 진행하고 있습니다.</p>
  <p>잠시 후 다시 방문해 주세요.</p>
  <div class="badge">🔧 현재 점검 진행 중</div>
</div>
</body>
</html>
